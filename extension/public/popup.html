<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>OTP Autofill</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; color: #111; }
      .muted { color: #666; }
      .warn { color: #b00020; }
      .code { font: 600 22px ui-monospace, monospace; letter-spacing: 3px; }
      section { margin-bottom: 12px; }
      ul { list-style: none; padding: 0; margin: 6px 0; }
      li { border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
      li .link { word-break: break-all; font-size: 12px; }
      button { margin-top: 4px; }
    </style>
  </head>
  <body>
    <section>
      <div id="status" class="muted">확인 중…</div>
      <button id="connect" hidden>Gmail 연결</button>
      <button id="disconnect" hidden>연결 해제</button>
      <button id="check" hidden>지금 확인</button>
    </section>
    <section>
      <div class="muted">최근 인증 메일</div>
      <ul id="items"></ul>
      <div id="empty" class="muted">없음</div>
    </section>
    <section class="muted">
      <label><input type="checkbox" id="mask" /> 알림에서 인증번호 가리기</label>
      <div id="notifHint">알림이 안 보이면 macOS 시스템 설정 › 알림 › Google Chrome 을 확인하세요.</div>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
