<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>OTP Autofill</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 280px; margin: 12px; }
      .code { font: 600 28px ui-monospace, monospace; letter-spacing: 4px; }
      .muted { color: #666; }
      .warn { color: #b00020; }
      button { margin-top: 6px; }
      section { margin-bottom: 14px; }
      input { width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <section id="latest">
      <div class="muted">최근 인증번호</div>
      <div class="code" id="code">—</div>
      <div class="muted" id="meta"></div>
      <button id="copy" disabled>복사</button>
    </section>
    <section id="pairing">
      <div class="muted">릴레이 서버</div>
      <input id="relay" value="http://localhost:8787" />
      <button id="pair">폰 페어링 시작</button>
      <button id="unpair" hidden>페어링 해제</button>
      <div id="pairStatus"></div>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
